# Chandler wobble forecast ledger: refresh IERS polar motion, issue this month's frozen projections (once per month
# per engine), backfill any missing hindcasts, rescore everything, and commit the results. Git history is the
# timestamp of every issue. See forecast/README.md.
name: cw-forecast

on:
  schedule:
    - cron: "17 6 * * 1"       # weekly, Monday 06:17 UTC (C04 updates a few times a week; issues are monthly)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cw-forecast
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast/requirements.txt

      - run: pip install -r forecast/requirements.txt

      # the last good downloads, so a server outage leaves the ledger running on older data
      - uses: actions/cache@v4
        with:
          path: forecast/cache
          key: eop-${{ github.run_id }}
          restore-keys: eop-

      - name: Run ledger
        run: python3 forecast/ledger.py all

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast/observations forecast/ledger forecast/scores forecast/claims_status.json forecast/REPORT.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            end=$(python3 -c "import json;print(round(json.load(open('forecast/observations/status.json'))['data_end'],3))")
            git commit -m "forecast ledger: data to ${end}"
            git push
          fi
